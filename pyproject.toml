[project]
name = "janus"
version = "0.1.0"
description = "Janus — provider-agnostic LLM gateway with SSE streaming, tool calling, structured outputs, prompt caching and per-request cost accounting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.100",
    "openai>=1.60",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# The playbook variants are loaded at runtime as the cacheable prompt prefix, so
# they have to ship with the package — a wheel without them fails on the first
# request. `playbook/` is a data directory, not a package, so it needs naming
# explicitly: a bare `*.md` would not reach into it.
[tool.setuptools.package-data]
"app.domain.prompts" = ["*.md", "playbook/*.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `live` tests are excluded here rather than left to the caller to remember.
# A bare `pytest` has to be free: the moment running the default suite can spend
# money, someone runs it in a loop. `pytest -m live` still works — a `-m` on the
# command line is applied after addopts and wins.
addopts = '-ra --strict-markers --strict-config -m "not live"'
asyncio_mode = "auto"
markers = [
    "live: hits a real provider API — costs money, needs credentials, skipped by default",
]
