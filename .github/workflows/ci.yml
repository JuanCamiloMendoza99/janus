name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # No secrets are configured and none are needed: the suite runs against the
    # fake provider, so CI makes no network calls and spends nothing. That is a
    # direct payoff of the provider seam (ADR-002).
    env:
      LLM_PROVIDER: fake
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest
