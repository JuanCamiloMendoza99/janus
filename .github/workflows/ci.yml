name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # No secrets are configured and none are needed: the suite runs against the
    # fake provider, so CI makes no network calls and spends nothing. That is a
    # direct payoff of the provider seam (ADR-002).
    env:
      LLM_PROVIDER: fake
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

  # The web console (Phase 6). Kept deliberately minimal: build the client and
  # run the SSE parser's unit tests. No JavaScript linting stack alongside ruff —
  # the point of the project is the gateway, not a second toolchain to maintain.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
